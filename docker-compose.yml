# SupportMind AI: docker compose up -d --build
# Requiere un archivo .env (copia .env.example y rellena los secretos).
#
# Solo el frontend se publica en todas las interfaces. La API, las bases de datos y la observabilidad
# se publican en 127.0.0.1 para desarrollo, y el servicio de IA (Python) no se publica: únicamente
# el backend Java puede llamarlo, dentro de la red de Docker.

name: supportmind

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # PostgreSQL con pgvector: datos de negocio (esquema public) y embeddings (esquema vector_store)
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportmind}
      POSTGRES_USER: ${POSTGRES_USER:-supportmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      # Rol del servicio de IA: lo crea el script de inicialización con acceso solo a vector_store
      VECTOR_DB_USER: ${VECTOR_DB_USER:-supportmind_ai}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD is required in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5460}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # AOF: la cola de jobs de IA (Redis Streams) sobrevive a un reinicio
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6392}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  python-ai:
    build:
      context: ./ai-service
      target: runtime
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY is required in .env}
      VECTOR_DB_HOST: postgres
      VECTOR_DB_PORT: 5432
      VECTOR_DB_NAME: ${POSTGRES_DB:-supportmind}
      VECTOR_DB_USER: ${VECTOR_DB_USER:-supportmind_ai}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-768}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      VECTOR_SEARCH_TOP_K: ${VECTOR_SEARCH_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-}
      LOG_FORMAT: json
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  java-api:
    build: ./backend-java
    # El cierre ordenado espera a los jobs de IA en curso (una respuesta del LLM puede tardar)
    stop_grace_period: 60s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-supportmind}
      POSTGRES_USER: ${POSTGRES_USER:-supportmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://python-ai:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-60s}
      AI_SERVICE_STREAM_TIMEOUT: ${AI_SERVICE_STREAM_TIMEOUT:-180s}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.55}
      VECTOR_SEARCH_TOP_K: ${VECTOR_SEARCH_TOP_K:-4}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      WORKER_CONSUMER_NAME: java-api
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8097}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build: ./frontend
    ports:
      - "${WEB_HOST_PORT:-4310}:8080"
    depends_on:
      java-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9097}:9090"
    depends_on:
      - java-api
      - python-ai
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3007}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  # ---- LLM y embeddings locales opcionales: docker compose --profile ollama up -d ----
  # Con este perfil, define en .env: LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=qwen2.5:1.5b,
  # EMBEDDING_PROVIDER=openai y EMBEDDING_MODEL=nomic-embed-text (ver README)
  ollama:
    image: ollama/ollama:0.34.3
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # Descarga los modelos una sola vez (quedan en el volumen ollama-data)
  ollama-pull:
    image: ollama/ollama:0.34.3
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:1.5b} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  ollama-data:
