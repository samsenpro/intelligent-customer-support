spring:
  application:
    name: supportmind-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supportmind}
    username: ${POSTGRES_USER:supportmind}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Las conexiones SSE las cierra SseHub con su propio timeout
      request-timeout: -1

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Detrás de nginx la IP real del cliente llega en X-Forwarded-For (solo se confía en proxies internos)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

supportmind:
  version: @project.version@
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: supportmind-api
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY}
    connect-timeout: 3s
    # Operaciones cortas (clasificación, sentimiento, búsqueda, sugerencias, indexación)
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:60s}
    # Respuesta del LLM en streaming: tiempo máximo total de la respuesta
    stream-timeout: ${AI_SERVICE_STREAM_TIMEOUT:180s}
  ai:
    # Umbral de confianza por defecto de las organizaciones nuevas (cada una puede cambiarlo)
    default-confidence-threshold: ${AI_CONFIDENCE_THRESHOLD:0.55}
    top-k: ${VECTOR_SEARCH_TOP_K:4}
    # Memoria de la conversación que se envía al LLM: últimos N mensajes + resumen
    history-messages: 10
    context-ttl: 30m
    # Mensajes nuevos desde el último resumen para volver a resumir
    resummarize-every: 8
    # Tiempo máximo que una conversación queda marcada como "IA procesando"
    processing-ttl: 5m
  queue:
    stream: supportmind:ai:jobs
    group: supportmind-workers
    consumer-name: ${WORKER_CONSUMER_NAME:${HOSTNAME:supportmind-api}}
    concurrency: ${WORKER_CONCURRENCY:4}
    poll-timeout: 2s
    # Mayor que el peor caso de un job (respuesta en streaming + reintentos)
    abandoned-after: 10m
    max-length: 10000
    maintenance-interval: 60s
  realtime:
    channel: supportmind:events
    sse-timeout: 30m
    heartbeat-interval: 20s
  idempotency:
    ttl: 24h
    pending-ttl: 2m
  cache:
    analytics-ttl: 60s
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_USER_PASSWORD:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    policies:
      # Login, registro y refresh por IP: frena ataques de fuerza bruta
      auth:
        limit: 10
        window: 1m
      # Creación de mensajes por usuario (cada mensaje de un cliente puede disparar la IA)
      messages:
        limit: ${RATE_LIMIT_MESSAGES_PER_MINUTE:30}
        window: 1m
      # Operaciones que consumen el LLM a petición del usuario (respuesta de la IA, sugerencias)
      ai:
        limit: ${RATE_LIMIT_AI_PER_MINUTE:20}
        window: 1m
      knowledge-search:
        limit: ${RATE_LIMIT_SEARCH_PER_MINUTE:30}
        window: 1m

resilience4j:
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.supportmind.ai.client.AiServiceUnavailableException
        ignore-exceptions:
          - com.supportmind.ai.client.AiServiceRejectedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      aiService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - com.supportmind.ai.client.AiServiceUnavailableException
        ignore-exceptions:
          - com.supportmind.ai.client.AiServiceRejectedException
  timelimiter:
    instances:
      aiService:
        timeout-duration: ${AI_SERVICE_READ_TIMEOUT:60s}
        cancel-running-future: true
      aiStream:
        timeout-duration: ${AI_SERVICE_STREAM_TIMEOUT:180s}
        cancel-running-future: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        # Lista cerrada: nada de env, beans, heapdump o configprops expuestos por accidente
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ai.latency: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@

logging:
  # En Docker se activa el formato JSON (ECS) con LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs: una línea por
  # evento, con correlation_id y conversation_id del MDC
  pattern:
    correlation: "[%X{correlation_id:-}] "
