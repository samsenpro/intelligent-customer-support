global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Backend Java: métricas de negocio (conversations_total, tickets_total, human_handoff_total),
  # llamadas a la IA (ai_requests_total, ai_errors_total, ai_latency_seconds), HTTP, JVM, HikariCP y
  # circuit breaker
  - job_name: java-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["java-api:8080"]

  # Servicio de IA: ai_requests_total, ai_latency_seconds, rag_search_latency_seconds, llm_latency_seconds,
  # embedding_latency_seconds, rag_outcomes_total...
  - job_name: python-ai
    metrics_path: /metrics/
    static_configs:
      - targets: ["python-ai:8000"]
